name: Tests

on:
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE.txt"
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "LICENSE.txt"

permissions:
  contents: read

# usage_credits 1.0 depends on wallets 0.3 before that version exists on
# RubyGems. Every CI lane resolves the exact reviewed Wallets candidate below;
# remove this source override only after the published dependency is available.
env:
  WALLETS_PATH: ${{ github.workspace }}/wallets-core

jobs:
  # Main test suite - tests Ruby versions and Rails/Pay compatibility with SQLite
  sqlite:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.3", "3.4", "4.0"]
        gemfile:
          - path: Gemfile
            label: default
          - path: gemfiles/rails_7.2.gemfile
            label: rails-7.2
          - path: gemfiles/rails_8.1.gemfile
            label: rails-8.1
          - path: gemfiles/pay_minimum.gemfile
            label: pay-minimum
        include:
          # Exercise both Rails boundaries on the minimum secure Ruby line.
          - ruby_version: "3.2"
            gemfile:
              path: gemfiles/rails_7.2.gemfile
              label: rails-7.2
          - ruby_version: "3.2"
            gemfile:
              path: gemfiles/rails_8.1.gemfile
              label: rails-8.1

    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile.path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout reviewed wallets 0.3 candidate
        uses: actions/checkout@v7
        with:
          repository: rameerez/wallets
          ref: 84b5b1f4b0ff46641d8e0e88719c3885cd980c7c
          path: wallets-core
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby_version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true

      - name: Prepare database and run tests
        # Exercise the real migration path in SQLite too so dummy/test schema
        # drift is caught before release, not only in adapter-specific jobs.
        run: bundle exec rake db:migrate:reset test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-sqlite-ruby-${{ matrix.ruby_version }}-${{ matrix.gemfile.label }}
          path: test/reports/
          retention-days: 7

  security:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        gemfile:
          - path: Gemfile
            label: default
          - path: gemfiles/rails_7.2.gemfile
            label: rails-7.2
          - path: gemfiles/rails_8.1.gemfile
            label: rails-8.1
          - path: gemfiles/pay_minimum.gemfile
            label: pay-minimum

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile.path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout reviewed wallets 0.3 candidate
        uses: actions/checkout@v7
        with:
          repository: rameerez/wallets
          ref: 84b5b1f4b0ff46641d8e0e88719c3885cd980c7c
          path: wallets-core
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Audit locked dependencies
        # ruby/setup-ruby may remove an untracked lock after populating its
        # cache, and bundler-audit does not infer the appraisal lock path from
        # BUNDLE_GEMFILE. Recreate and audit the exact graph explicitly.
        run: |
          bundle lock
          bundle exec bundle-audit check --update --gemfile-lock "$BUNDLE_GEMFILE.lock"

  # PostgreSQL compatibility tests
  postgres:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.4"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usage_credits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/usage_credits_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout reviewed wallets 0.3 candidate
        uses: actions/checkout@v7
        with:
          repository: rameerez/wallets
          ref: 84b5b1f4b0ff46641d8e0e88719c3885cd980c7c
          path: wallets-core
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby_version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true

      - name: Prepare database
        # Use db:migrate:reset instead of db:test:prepare to avoid loading schema.rb
        # which has SQLite-specific defaults that fail on PostgreSQL.
        # db:migrate:reset does: db:drop, db:create, db:migrate (using migrations, not schema.rb)
        run: bundle exec rake db:migrate:reset

      - name: Run tests
        run: bundle exec rake test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-postgres-ruby-${{ matrix.ruby_version }}
          path: test/reports/
          retention-days: 7

  # MySQL compatibility tests
  mysql:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.4"]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: usage_credits_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root:root@127.0.0.1:3306/usage_credits_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout reviewed wallets 0.3 candidate
        uses: actions/checkout@v7
        with:
          repository: rameerez/wallets
          ref: 84b5b1f4b0ff46641d8e0e88719c3885cd980c7c
          path: wallets-core
          persist-credentials: false

      - name: Set up Ruby ${{ matrix.ruby_version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true

      - name: Prepare database
        # Use db:migrate:reset instead of db:test:prepare to avoid loading schema.rb
        # which has SQLite-specific defaults that fail on MySQL (JSON column defaults).
        # db:migrate:reset does: db:drop, db:create, db:migrate (using migrations, not schema.rb)
        run: bundle exec rake db:migrate:reset

      - name: Run tests
        run: bundle exec rake test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-mysql-ruby-${{ matrix.ruby_version }}
          path: test/reports/
          retention-days: 7
